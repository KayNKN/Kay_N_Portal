<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224">
  <!-- KAY_N - "The Receiver" mark. black / white / red only. -->
  <rect width="200" height="224" fill="#050505"/>
  <!-- antennae: three spikes up, two blades out -->
  <g fill="#050505" stroke="#f2f2f2" stroke-width="3" stroke-linejoin="round">
    <path d="M95 62 L97 8 L104 60 Z"/>
    <path d="M85 64 L52 20 L93 60 Z"/>
    <path d="M108 60 L148 22 L115 62 Z"/>
    <path d="M78 84 L18 72 L80 92 Z"/>
    <path d="M122 84 L182 72 L120 92 Z"/>
  </g>
  <!-- jacket -->
  <path d="M34 224 L28 190 L44 158 L84 147 L100 159 L116 147 L156 158 L172 190 L166 224 Z"
        fill="#050505" stroke="#f2f2f2" stroke-width="3" stroke-linejoin="round"/>
  <!-- lapels -->
  <g fill="#050505" stroke="#f2f2f2" stroke-width="2.5" stroke-linejoin="round">
    <path d="M84 147 L100 159 L86 198 L62 166 Z"/>
    <path d="M70 158 L59 151 L66 167 Z"/>
    <path d="M116 147 L100 159 L114 198 L138 166 Z"/>
    <path d="M130 158 L141 151 L134 167 Z"/>
  </g>
  <!-- shirt -->
  <path d="M88 152 L112 152 L104 176 L96 176 Z" fill="#f2f2f2"/>
  <!-- neck -->
  <path d="M93 138 L107 138 L109 152 L91 152 Z" fill="#050505" stroke="#f2f2f2" stroke-width="2.5"/>
  <!-- collar wings -->
  <g fill="#f2f2f2" stroke="#050505" stroke-width="1.5">
    <path d="M86 152 L100 147 L95 164 Z"/>
    <path d="M114 152 L100 147 L105 164 Z"/>
  </g>
  <!-- tie -->
  <g fill="#050505" stroke="#f2f2f2" stroke-width="2.5" stroke-linejoin="round">
    <path d="M100 150 L109 159 L100 168 L91 159 Z"/>
    <path d="M95 167 L105 167 L109 206 L100 220 L92 206 Z"/>
  </g>
  <!-- head -->
  <path d="M85 58 L115 58 L127 80 L123 110 L108 138 L92 138 L77 110 L73 80 Z"
        fill="#050505" stroke="#f2f2f2" stroke-width="3" stroke-linejoin="round"/>
  <!-- visor -->
  <path d="M100 64 L126 90 L100 116 L74 90 Z" fill="#ff2323"/>
  <!-- lens -->
  <circle cx="100" cy="90" r="10" fill="#f2f2f2"/>
  <circle cx="100" cy="90" r="6.5" fill="#050505"/>
  <circle cx="100" cy="90" r="3.5" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
  <circle cx="100" cy="90" r="1.3" fill="#f2f2f2"/>
</svg>
